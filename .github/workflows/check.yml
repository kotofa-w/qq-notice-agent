name: Verify public source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: workbuddy-qq-agent-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated SDK and image dependencies
        run: ./modules/workbuddy-agent/setup.ps1
      - name: Node offline tests
        run: npm test
      - name: Python bridge tests
        run: ./modules/workbuddy-agent/.venv/Scripts/python.exe -X utf8 test/workbuddy-bridge-recovery.test.py
      - name: Python image tests
        run: ./modules/workbuddy-agent/.venv/Scripts/python.exe -X utf8 modules/workbuddy-agent/test_image_processing.py
      - name: Audit tracked publication objects
        run: npm run audit:public
